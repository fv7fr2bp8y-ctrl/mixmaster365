    <style>
        :root {
            --gold: #c9a961;
            --gold-bright: #e8c987;
            --gold-dim: #7a6535;
            --cream: #f0e4cf;
            --cream-dim: #b9a98a;
            --ink: #0a0908;
            --ink-soft: #161311;
        }

        body.theme-light {
            --gold: #b6782d;
            --gold-bright: #cf8f3a;
            --gold-dim: #bfa06c;
            --cream: #3f2f1e;
            --cream-dim: #7a6550;
            --ink: #fff8ec;
            --ink-soft: #f4e7d2;
            background-color: var(--ink);
            background:
                linear-gradient(180deg, rgba(255,250,240,.92), rgba(244,234,216,.94)),
                url("https://images.unsplash.com/photo-1490818387583-1baba5e638af?w=1400&auto=format&fit=crop&q=80") center/cover fixed;
        }

        body.theme-light::before {
            opacity: 0.08;
            mix-blend-mode: multiply;
        }

        body.theme-light .text-cream { color: var(--cream) !important; }
        body.theme-light .text-cream\/80 { color: rgba(63, 47, 30, 0.8) !important; }
        body.theme-light .text-cream-dim,
        body.theme-light .text-cream-dim\/50,
        body.theme-light .text-cream-dim\/70 { color: var(--cream-dim) !important; }
        body.theme-light .text-gold,
        body.theme-light .text-gold-bright { color: var(--gold-bright) !important; }
        body.theme-light .text-gold-dim { color: var(--gold-dim) !important; }
        body.theme-light .bg-ink { background-color: var(--ink) !important; }
        body.theme-light .bg-ink\/70 { background-color: rgba(255, 248, 236, 0.76) !important; }
        body.theme-light .bg-ink\/80 { background-color: rgba(255, 248, 236, 0.88) !important; }
        body.theme-light .bg-ink-soft { background-color: var(--ink-soft) !important; }
        body.theme-light .from-ink { --tw-gradient-from: var(--ink) var(--tw-gradient-from-position); --tw-gradient-to: rgba(255, 248, 236, 0) var(--tw-gradient-to-position); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
        body.theme-light .via-ink { --tw-gradient-to: rgba(255, 248, 236, 0) var(--tw-gradient-to-position); --tw-gradient-stops: var(--tw-gradient-from), var(--ink) var(--tw-gradient-via-position), var(--tw-gradient-to); }
        body.theme-light .via-ink\/60 { --tw-gradient-to: rgba(255, 248, 236, 0) var(--tw-gradient-to-position); --tw-gradient-stops: var(--tw-gradient-from), rgba(255, 248, 236, 0.58) var(--tw-gradient-via-position), var(--tw-gradient-to); }
        body.theme-light .to-ink\/10 { --tw-gradient-to: rgba(255, 248, 236, 0.1) var(--tw-gradient-to-position); }
        body.theme-light .border-gold,
        body.theme-light .border-gold-dim { border-color: var(--gold-dim) !important; }
        body.theme-light .deco-card { box-shadow: 0 16px 50px rgba(121, 84, 37, 0.12); }
        body.theme-light input { color: var(--cream); }
        body.theme-light ::placeholder { color: var(--cream-dim); }
        body.theme-light #search-input,
        body.theme-light #search-input:focus {
            background: rgba(255, 250, 240, 0.56) !important;
            color: var(--cream) !important;
        }
        body.theme-light #search-input::placeholder {
            color: var(--cream-dim) !important;
            opacity: 1;
        }
        body.theme-light .page-frame::before { display: none; }
        body.theme-light .deco-card {
            background: rgba(255, 250, 240, 0.88);
            border: 1px solid #d8c5aa;
            box-shadow: 0 18px 50px rgba(81, 57, 31, 0.12);
        }
        body.theme-light .deco-card::before,
        body.theme-light .deco-card::after,
        body.theme-light .deco-card > .corners::before,
        body.theme-light .deco-card > .corners::after {
            display: none;
        }
        body.theme-light .image-frame {
            border: 0;
            outline: 0;
        }
        body.theme-light .filter-active {
            color: #ffffff !important;
        }
        body.theme-light .filter-active span:first-child {
            background: #66845d;
            color: #ffffff;
            border-color: #66845d;
        }
        body.theme-light #filters-container button span:first-child {
            display: inline-flex;
            align-items: center;
            min-height: 2.05rem;
            border: 1px solid #d8c5aa;
            padding: 0.42rem 0.78rem;
            letter-spacing: 0.14em;
        }
        body.theme-light #cotd-card {
            border: 1px solid #d8c5aa;
            box-shadow: 0 18px 50px rgba(81, 57, 31, 0.12);
        }
        body.theme-light .btn-gold {
            background: linear-gradient(180deg, #c88b34 0%, #b6782d 100%);
            box-shadow: 0 12px 30px rgba(121, 84, 37, 0.16);
        }
        body.theme-light .recipe-content {
            font-style: normal;
            text-align: left;
            color: rgba(48, 39, 29, 0.82);
        }
        body.theme-light .recipe-content p { margin: 0.6em 0; }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--ink);
            color: var(--cream);
            margin: 0;
            /* Subtle radial vignette for depth */
            background-image:
                radial-gradient(ellipse at top, rgba(201, 169, 97, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(74, 14, 14, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
        }

        /* Subtle paper-grain noise overlay, super faint */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.025;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        input { font-size: 16px; font-family: 'Cormorant Garamond', serif; }
        ::placeholder { color: var(--cream-dim); opacity: 0.6; font-style: italic; }

        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* === Deco ornaments === */
        .deco-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--gold);
        }
        .deco-divider::before, .deco-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
        }

        /* Card frame with deco corners */
        .deco-card {
            position: relative;
            background: var(--ink-soft);
            border: 1px solid var(--gold-dim);
        }
        .deco-card::before, .deco-card::after,
        .deco-card > .corners::before, .deco-card > .corners::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--gold);
            pointer-events: none;
            z-index: 2;
        }
        .deco-card::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .deco-card::after { top: 6px; right: 6px; border-left: none; border-bottom: none; }
        .deco-card > .corners::before { bottom: 6px; left: 6px; border-right: none; border-top: none; }
        .deco-card > .corners::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

        /* Image gold frame */
        .image-frame {
            position: relative;
            border: 1px solid var(--gold);
            outline: 1px solid var(--gold-dim);
            outline-offset: 4px;
        }

        /* Active filter underline */
        .filter-active {
            color: var(--gold-bright) !important;
        }
        .filter-active .filter-underline {
            transform: scaleX(1) !important;
            opacity: 1 !important;
        }
        .filter-underline {
            transform: scaleX(0);
            opacity: 0;
            transition: all 0.3s ease;
        }

        /* Roman numeral medallion */
        .numeral-medallion {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-family: 'Forum', serif;
        }

        /* Sunburst rays behind the loader mark */
        .sunburst {
            position: absolute;
            inset: 0;
            opacity: 0.25;
            background:
                conic-gradient(from 0deg,
                    transparent 0deg, var(--gold) 1deg, transparent 2deg,
                    transparent 14deg, var(--gold) 15deg, transparent 16deg,
                    transparent 28deg, var(--gold) 29deg, transparent 30deg,
                    transparent 44deg, var(--gold) 45deg, transparent 46deg,
                    transparent 58deg, var(--gold) 59deg, transparent 60deg,
                    transparent 74deg, var(--gold) 75deg, transparent 76deg,
                    transparent 88deg, var(--gold) 89deg, transparent 90deg,
                    transparent 104deg, var(--gold) 105deg, transparent 106deg,
                    transparent 118deg, var(--gold) 119deg, transparent 120deg,
                    transparent 134deg, var(--gold) 135deg, transparent 136deg,
                    transparent 148deg, var(--gold) 149deg, transparent 150deg,
                    transparent 164deg, var(--gold) 165deg, transparent 166deg,
                    transparent 178deg, var(--gold) 179deg, transparent 180deg,
                    transparent 194deg, var(--gold) 195deg, transparent 196deg,
                    transparent 208deg, var(--gold) 209deg, transparent 210deg,
                    transparent 224deg, var(--gold) 225deg, transparent 226deg,
                    transparent 238deg, var(--gold) 239deg, transparent 240deg,
                    transparent 254deg, var(--gold) 255deg, transparent 256deg,
                    transparent 268deg, var(--gold) 269deg, transparent 270deg,
                    transparent 284deg, var(--gold) 285deg, transparent 286deg,
                    transparent 298deg, var(--gold) 299deg, transparent 300deg,
                    transparent 314deg, var(--gold) 315deg, transparent 316deg,
                    transparent 328deg, var(--gold) 329deg, transparent 330deg,
                    transparent 344deg, var(--gold) 345deg, transparent 346deg);
            -webkit-mask: radial-gradient(circle, transparent 30%, black 35%, black 90%, transparent 100%);
                    mask: radial-gradient(circle, transparent 30%, black 35%, black 90%, transparent 100%);
            border-radius: 50%;
        }

        /* Gold button */
        .btn-gold {
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 50%, var(--gold-dim) 100%);
            color: var(--ink);
            font-family: 'Forum', serif;
            letter-spacing: 0.25em;
            border: 1px solid var(--gold);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 4px 20px rgba(201, 169, 97, 0.2);
        }
        .btn-gold:active { transform: translateY(1px); }

        /* Animations */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .cocktail-card { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

        @keyframes goldPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(232, 201, 135, 0.6), inset 0 0 0 1px var(--gold); }
            50% { box-shadow: 0 0 0 18px rgba(232, 201, 135, 0), inset 0 0 0 2px var(--gold-bright); }
        }
        .highlight { animation: goldPulse 1.6s ease-out 2; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sheet-overlay { animation: fadeIn 0.25s ease-out; }
        .sheet-panel { animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1); }

        @keyframes diamondPop {
            0%, 100% { transform: scale(1) rotate(0); }
            45% { transform: scale(1.4) rotate(45deg); }
        }
        .star-pop { animation: diamondPop 0.45s ease-out; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .deco-spin { animation: spin 2s linear infinite; }

        /* Recipe content (rendered HTML from sheets) */
        .recipe-content { font-family: 'Cormorant Garamond', serif; font-style: italic; line-height: 1.7; }
        .recipe-content a { color: var(--gold-bright); text-decoration: underline; text-decoration-color: var(--gold-dim); }
        .recipe-content strong, .recipe-content b { color: var(--cream); font-weight: 600; font-style: normal; }
        .recipe-content p { margin: 0.4em 0; }
        .recipe-content ul, .recipe-content ol { padding-left: 1.2em; margin: 0.4em 0; }

        /* Safe area for iPhone notch / home bar */
        .safe-bottom { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }

        /* Page edge frame (subtle gold rule on each side) */
        .page-frame {
            position: relative;
        }
        .page-frame::before {
            content: '';
            position: absolute;
            top: 1.5rem;
            bottom: 1.5rem;
            left: 0.25rem;
            right: 0.25rem;
            border-left: 1px solid var(--gold-dim);
            border-right: 1px solid var(--gold-dim);
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
</head>

    <!-- INTRO BAR LOADER -->
    <div id="bar-loader" aria-label="Brunch 365">
        <div class="loader-content">
            <div class="loader-logo-wrap">
                <img class="loader-logo" src="logo-source.png" alt="">
            </div>
            <h1 class="loader-title">Brunch 365</h1>
            <p class="loader-subtitle" data-i18n="intro_subtitle">Бранч всеки ден</p>
            <div class="loader-status" data-i18n="intro_status">Подготвяне на рецептите...</div>
        </div>
    </div>

    <style>
        #bar-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 50% 28%, rgba(232,201,135,.18), transparent 34%),
                linear-gradient(180deg, #fffaf0 0%, #f4ead8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
        }
        .loader-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .loader-logo-wrap {
            width: 112px;
            height: 112px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border: 1px solid rgba(194,133,45,.26);
            background: rgba(255,250,240,.72);
            box-shadow: 0 18px 48px rgba(48,39,29,.10);
            animation: logoReveal 1.2s cubic-bezier(.16,1,.3,1) both;
        }
        .loader-logo {
            width: 88px;
            height: 88px;
            object-fit: contain;
            display: block;
        }
        .loader-title {
            color: #30271d;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 10px;
            margin: 15px 0 8px 0;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            opacity: 0;
            animation: fadeInElement 1.8s ease 1s forwards;
        }
        .loader-subtitle {
            color: #7d6b58;
            font-size: 10px;
            letter-spacing: 6px;
            margin: 0 0 25px 0;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            opacity: 0;
            animation: fadeInElement 1.8s ease 1.6s forwards;
        }
        .loader-status {
            color: #9d4f55;
            font-size: 12px;
            font-style: italic;
            letter-spacing: 3px;
            font-family: 'Cinzel', serif;
            opacity: 0;
            animation: fadeInElement 1.5s ease 2.2s forwards;
        }
        @keyframes logoReveal {
            from { opacity: 0; transform: translateY(10px) scale(.92); }
            to { opacity: 1; transform: none; }
        }
        @keyframes fadeInElement {
            to { opacity: 1; }
        }
        #bar-loader.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>

    <script>
        // Hide loader after 3.5s, then remove from DOM
        setTimeout(function() {
            const loader = document.getElementById('bar-loader');
            loader.classList.add('loaded');
            setTimeout(() => loader.remove(), 900);
        }, 3500);
    </script>

        // --- State ---
        let LANG = 'bg';
        let UNIT = 'ml';
        (function initPrefs(){
            try {
                const sl = localStorage.getItem('brk365-lang');
                if (sl && I18N[sl]) LANG = sl;
                const su = localStorage.getItem('brk365-unit');
                if (su === 'oz' || su === 'ml') UNIT = su;
            } catch(e) {}
            document.documentElement.lang = LANG;
        })();

        function isLocked(item) {
            return false;
        }

        function t(key, vars) {
            let s = (I18N[LANG] && I18N[LANG][key]) || (I18N.bg[key]) || key;
            if (vars) for (const k in vars) s = s.replace('{'+k+'}', vars[k]);
            return s;
        }

        // --- Units (ml <-> oz) ---
        function mlToOz(ml) {
            const oz = Math.round((ml/29.5735) * 4) / 4;
            return oz.toString();
        }
        function convertUnits(text) {
            if (UNIT !== 'oz' || !text) return text;
            return String(text).replace(/(\d+(?:[.,]\d+)?)\s*(мл|ml)(?=[\s.,;:)]|$)/gi, (m, n) => {
                const ml = parseFloat(n.replace(',', '.'));
                if (isNaN(ml)) return m;
                return mlToOz(ml) + ' oz';
            });
        }

        // --- Apply static translations to DOM ---
        function applyStaticI18n() {
            document.documentElement.lang = LANG;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
            });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => {
                el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
            });
        }

        let THEME = 'light';
        (function initTheme(){ THEME = 'light'; })();

        function applyTheme() {
            document.body.classList.add('theme-light');
        }

        function toggleTheme() { applyTheme(); }

        // --- Settings sheet (language + units) ---
        function openSettings() {
            const langGrid = LANGS.map(l => `
                <button onclick="setLang('${l.code}')" class="border ${l.code===LANG?'border-gold text-gold-bright bg-ink-soft':'border-gold-dim text-cream-dim'} hover:border-gold hover:text-gold active:scale-[0.98] transition p-3 flex items-center gap-3">
                    <span class="text-2xl">${l.flag}</span>
                    <span class="font-roman text-sm tracking-[0.1em]">${l.name}</span>
                </button>`).join('');
            const unitBtn = (u, label) => `
                <button onclick="setUnit('${u}')" class="flex-1 py-3 font-roman text-xs tracking-[0.3em] uppercase transition border ${u===UNIT?'border-gold bg-gold text-ink':'border-gold-dim text-cream-dim hover:text-gold hover:border-gold'}">${label}</button>`;
            document.getElementById('settings-content').innerHTML = `
                <div class="grid grid-cols-1 gap-2.5">${langGrid}</div>
                <div class="mt-7">
                    <div class="deco-divider mb-4">
                        <span class="font-roman text-gold text-[0.6rem] tracking-[0.4em] uppercase whitespace-nowrap">${t('settings_units')}</span>
                    </div>
                    <div class="flex gap-2">
                        ${unitBtn('ml','ml')}
                        ${unitBtn('oz','oz')}
                    </div>
                </div>
                `;
            document.getElementById('settings-modal').classList.remove('hidden');
        }
        function closeSettings(){ document.getElementById('settings-modal').classList.add('hidden'); }

        function refreshDynamic() {
            if (typeof renderFilters === 'function') renderFilters();
            if (typeof render === 'function') render(false);
            if (typeof renderCOTD === 'function') renderCOTD();
            if (typeof updateFavBar === 'function') updateFavBar();
        }
        function setLang(code) {
            if (!I18N[code]) return;
            LANG = code;
            try { localStorage.setItem('brk365-lang', code); } catch(e){}
            applyStaticI18n();
            refreshDynamic();
            openSettings(); // refresh highlight
        }
        function setUnit(u) {
            UNIT = u;
            try { localStorage.setItem('brk365-unit', u); } catch(e){}
            refreshDynamic();
            openSettings();
        }

        // True when running inside the installed Android app (TWA), false on the web
        function isTWA() {
            try {
                return document.referrer.startsWith('android-app://') ||
                       new URLSearchParams(location.search).get('app') === '1';
            } catch(e) { return false; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(); applyStaticI18n();
            // Show "Get it on Google Play" badge only on the web (not inside the app)
            if (!isTWA()) { var b=document.getElementById('play-badge'); if(b) b.classList.remove('hidden'); }
        });
    </script>

        <div onclick="closeAISheet()" class="sheet-overlay absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        <div class="sheet-panel absolute bottom-0 left-0 right-0 max-w-md mx-auto">
            <div class="bg-ink border-t border-gold p-6 pb-10 safe-bottom">
                <div class="deco-divider mx-auto max-w-[100px] mb-5">
                    <span class="text-gold text-sm">◆</span>
                </div>
                <h2 data-i18n="ai_title" class="font-display text-3xl text-gold tracking-[0.15em] text-center mb-1">ПРЕПОРЪКА</h2>
                <p class="font-body italic text-cream-dim text-sm text-center mb-7">— <span data-i18n="ai_subtitle">Какво да приготвим?</span> —</p>
                <div class="space-y-3" id="ai-actions"></div>
                <button onclick="closeAISheet()" data-i18n="close" class="w-full mt-5 border border-gold-dim text-cream-dim hover:text-gold hover:border-gold py-3 font-roman text-xs tracking-[0.3em] uppercase transition">
                    Затвори
                </button>
            </div>
        </div>
    </div>

    <!-- STATS MODAL -->
    <div id="stats-modal" class="fixed inset-0 z-50 hidden">
        <div onclick="closeStats()" class="sheet-overlay absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        <div class="sheet-panel absolute bottom-0 left-0 right-0 max-w-md mx-auto max-h-[88vh] overflow-y-auto no-scrollbar">
            <div class="bg-ink border-t border-gold p-6 pb-10 safe-bottom">
                <div class="deco-divider mx-auto max-w-[100px] mb-5">
                    <span class="text-gold text-sm">◆</span>
                </div>
                <h2 data-i18n="stats_title" class="font-display text-3xl text-gold tracking-[0.15em] text-center mb-1">АТЕЛИЕ</h2>
                <p class="font-body italic text-cream-dim text-sm text-center mb-7">— <span data-i18n="stats_subtitle">Анализ на колекцията</span> —</p>
                <div id="stats-content" class="space-y-5"></div>
                <button onclick="closeStats()" data-i18n="close" class="w-full mt-6 border border-gold-dim text-cream-dim hover:text-gold hover:border-gold py-3 font-roman text-xs tracking-[0.3em] uppercase transition">
                    Затвори
                </button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL (language + units) -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden">
        <div onclick="closeSettings()" class="sheet-overlay absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        <div class="sheet-panel absolute bottom-0 left-0 right-0 max-w-md mx-auto max-h-[88vh] overflow-y-auto no-scrollbar">
            <div class="bg-ink border-t border-gold p-6 pb-10 safe-bottom">
                <div class="deco-divider mx-auto max-w-[100px] mb-5">
                    <span class="text-gold text-sm">◆</span>
                </div>
                <h2 data-i18n="settings_title" class="font-display text-3xl text-gold tracking-[0.15em] text-center mb-1">ЕЗИК</h2>
                <p class="font-body italic text-cream-dim text-sm text-center mb-7">— <span data-i18n="settings_subtitle">Език и мерни единици</span> —</p>
                <div id="settings-content" class="space-y-2"></div>
                <button onclick="closeSettings()" data-i18n="close" class="w-full mt-6 border border-gold-dim text-cream-dim hover:text-gold hover:border-gold py-3 font-roman text-xs tracking-[0.3em] uppercase transition">
                    Затвори
                </button>
            </div>
        </div>
    </div>

    <script>
        // === LEGACY STARTUP ===
        let underAge = false;

        function ageVerify() {
            underAge = false;
            init();
        }

        // Start the breakfast collection directly.
        (function() {
            try {
                document.getElementById('loader').classList.remove('hidden');
            } catch(e) {}
        })();

        const dataBase       = "https://script.google.com/macros/s/AKfycbwtMLRmJa3Lccsz4YLh0UwCFG7O_BZv-H-U08lcZgmX4JkCXmco0PmhoKB6Oc3PdEUYtQ/exec";
        const BREAKFAST_SHEET_ID = "1GRd1I9nZ8N1vSSngaTIM1PzP7NmXhrAWHhKmzi1XE1g";
        const BREAKFAST_GID      = "83321663";
        const apiUrl             = dataBase + `?ssid=${BREAKFAST_SHEET_ID}&gid=${BREAKFAST_GID}`;
        const mocktailsUrl       = apiUrl;

        // === STATE ===
        let allCocktails  = [];
        let allMocktails  = [];
        let cotdCocktail  = null;
        let currentMode   = 'mocktails'; // 'cocktails' | 'mocktails'
        const PAGE_SIZE   = 20;
        let currentPage   = 1;

        const MOCKTAIL_FILTERS = [
            { key: 'filter_all',       match: null },
            { key: 'filter_eggs',      match: ['яйц', 'менемен', 'шакшука'] },
            { key: 'filter_oatmeal',   match: ['каша', 'овес', 'просо', 'елда', 'теф', 'конджи'] },
            { key: 'filter_pancakes',  match: ['палачин', 'доса', 'биндеток', 'дан бинг', 'тапиока', 'рости'] },
            { key: 'filter_toast',     match: ['тост', 'toast', 'хляб', 'пита'] },
            { key: 'filter_bowls',     match: ['купа', 'bowl'] },
            { key: 'filter_soups',     match: ['супа', 'дал', 'фасолада', 'риболита', 'caldo'] },
            { key: 'filter_sweet',     match: ['слад', 'манго', 'банан', 'боровинки', 'ябълка', 'круша', 'портокал', 'кокос'] },
            { key: 'filter_legumes',   match: ['боб', 'нахут', 'леща', 'дал', 'лобио'] },
        ];
        let currentFilter = 'filter_all';
        let searchQuery = '';
        let showFavoritesOnly = false;
        let favorites = [];
        try { favorites = JSON.parse(localStorage.getItem('brk365-favorites') || '[]'); } catch (e) { favorites = []; }

        const FILTERS = [
            { key: 'filter_all',     match: null },
            { key: 'filter_vodka',   match: ['водка', 'vodka'] },
            { key: 'filter_gin',     match: ['джин', 'gin'] },
            { key: 'filter_rum',     match: ['ром', 'rum'] },
            { key: 'filter_tequila', match: ['текила', 'tequila'] },
            { key: 'filter_whisky',  match: ['уиски', 'whisky', 'whiskey', 'bourbon'] },
        ];

        // === HELPERS ===
        const LOCAL_BREAKFAST_IMAGES = {
            '1': 'images/001-shakshuka-eggs-roasted-peppers-no-parsley.png',
            '2': 'images/002-savory-oatmeal-egg-feta-generated.jpg',
            '3': 'images/003-avocado-toast-poached-egg-generated.jpg',
        };

        function getDriveImg(link) {
            if (!link || !link.includes("drive.google.com")) return link || 'logo-source.png';
            try {
                const id = link.match(/\/d\/(.+?)\//)[1];
                return `https://drive.google.com/thumbnail?id=${id}&sz=w1200`;
            } catch (e) { return link; }
        }

        function getRecipeImg(item) {
            const local = item && LOCAL_BREAKFAST_IMAGES[String(item.id)];
            return getDriveImg((item && item.image) || local);
        }

        function getRecipeFallbackImg(item) {
            return (item && LOCAL_BREAKFAST_IMAGES[String(item.id)]) || 'logo-source.png';
        }

        function hasRecipeImage(item) {
            return !!(item && String(item.image || '').trim());
        }

        function hashString(value) {
            let h = 2166136261;
            const str = String(value || '');
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function mixBreakfastOrder(items) {
            const groups = new Map();
            items.filter(c => c && c.name).forEach(item => {
                const key = String(item.base || 'други').trim().toLowerCase() || 'други';
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(item);
            });
            const buckets = Array.from(groups.values())
                .map(group => group.slice().sort((a, b) => hashString(a.name) - hashString(b.name)))
                .sort((a, b) => b.length - a.length);
            const mixed = [];
            let added = true;
            while (added) {
                added = false;
                buckets.forEach(group => {
                    if (group.length) {
                        mixed.push(group.shift());
                        added = true;
                    }
                });
            }
            const invalid = items.filter(c => !c || !c.name);
            return mixed.concat(invalid);
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function toRoman(num) {
            return Number.isFinite(Number(num)) ? String(Number(num)) : '';
        }

        function activeList()    { return currentMode === 'mocktails' ? allMocktails : allCocktails; }
        function activeFilters() { return currentMode === 'mocktails' ? MOCKTAIL_FILTERS : FILTERS; }

        // Localized field accessor — falls back to original Bulgarian
        function loc(item, field) {
            if (!item) return '';
            if (LANG !== 'bg') {
                const v = item[field + '_' + LANG];
                if (v != null && String(v).trim()) return v;
            }
            return item[field] != null ? item[field] : '';
        }

        function matchesBase(cocktail, filter) {
            if (!filter || !filter.match) return true;
            const haystack = [
                cocktail.name,
                cocktail.base,
                cocktail.ingredients,
                loc(cocktail, 'name'),
                loc(cocktail, 'base'),
                loc(cocktail, 'ingredients')
            ].join(' ').toLowerCase();
            return filter.match.some(m => haystack.includes(String(m).toLowerCase()));
        }

        function getFiltered() {
            let result = activeList().filter(c => c && c.name);

            if (showFavoritesOnly) {
                result = result.filter(c => favorites.includes(c.name));
            }

            const filterObj = activeFilters().find(f => f.key === currentFilter);
            if (filterObj && filterObj.match) {
                result = result.filter(c => matchesBase(c, filterObj));
            }

            if (searchQuery) {
                const q = searchQuery.toLowerCase().trim();
                result = result.filter(c =>
                    (c.name || '').toLowerCase().includes(q) ||
                    (c.recipe || '').toLowerCase().includes(q) ||
                    (c.base || '').toLowerCase().includes(q) ||
                    String(loc(c,'name')).toLowerCase().includes(q) ||
                    String(loc(c,'ingredients')).toLowerCase().includes(q) ||
                    String(loc(c,'base')).toLowerCase().includes(q)
                );
            }
            return result;
        }

        // === MODE SWITCH ===
        function setMode(mode) {
            currentMode = mode;
            currentFilter = 'filter_all';
            searchQuery = '';
            showFavoritesOnly = false;
            document.getElementById('search-input').value = '';
            document.getElementById('search-clear').classList.add('hidden');
            document.getElementById('search-icon').classList.remove('hidden');

            // Tab styling via inline style (reliable across Tailwind CDN)
            const tabC = document.getElementById('tab-cocktails');
            const tabM = document.getElementById('tab-mocktails');
            if (mode === 'cocktails') {
                tabC.style.background = 'var(--gold)'; tabC.style.color = 'var(--ink)';
                tabM.style.background = 'transparent'; tabM.style.color = 'var(--cream-dim)';
            } else {
                tabM.style.background = 'var(--gold)'; tabM.style.color = 'var(--ink)';
                tabC.style.background = 'transparent'; tabC.style.color = 'var(--cream-dim)';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderFilters();
            render();
            renderCOTD();
        }

        // === COCKTAIL OF THE DAY ===
        function renderCOTD() {
            const pool = activeList().filter(c => c && c.name);
            if (!pool.length) {
                document.getElementById('cotd-section').classList.add('hidden');
                return;
            }

            const today = new Date();
            const seed  = today.getFullYear() * 1000 + today.getMonth() * 50 + today.getDate();
            cotdCocktail = pool[seed % pool.length];

            const months = I18N[LANG].months;

            const cotdImg = document.getElementById('cotd-img');
            cotdImg.onerror = () => { cotdImg.onerror = null; cotdImg.src = getRecipeFallbackImg(cotdCocktail); };
            cotdImg.src = getRecipeImg(cotdCocktail);
            document.getElementById('cotd-name').textContent  = loc(cotdCocktail,'name');
            document.getElementById('cotd-base').textContent  = cotdCocktail.base ? '— ' + loc(cotdCocktail,'base') + ' —' : '';
            document.getElementById('cotd-icon').textContent  = '◇';
            document.getElementById('cotd-day').textContent   = today.getDate();
            document.getElementById('cotd-month').textContent = months[today.getMonth()];

            document.getElementById('cotd-section').classList.remove('hidden');
        }

        function goToCOTD() {
            if (!cotdCocktail) return;
            currentFilter  = 'filter_all';
            searchQuery    = '';
            showFavoritesOnly = false;
            document.getElementById('search-input').value = '';
            document.getElementById('search-clear').classList.add('hidden');
            document.getElementById('search-icon').classList.remove('hidden');
            renderFilters();

            // Render enough pages so the COTD card is visible
            const data = getFiltered();
            const idx  = data.findIndex(d => d._idx === cotdCocktail._idx);
            currentPage = Math.max(1, Math.ceil((idx + 1) / PAGE_SIZE));
            render(false);

            setTimeout(() => highlightCocktail(cotdCocktail), 150);
        }

        // === INIT ===
        function hydrateBreakfastData(data) {
            allMocktails = mixBreakfastOrder(Array.isArray(data) ? data.filter(hasRecipeImage) : []);
            allMocktails.forEach((c, i) => { if (c) c._idx = i; });
            renderFilters();
            render();
            renderCOTD();
            document.getElementById('loader').classList.add('hidden');
        }

        async function fetchWithTimeout(url, timeoutMs = 12000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                if (!res.ok) throw new Error('Bad response');
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function init() {
            const localData = Array.isArray(window.BREAKFAST_DATA) ? window.BREAKFAST_DATA : [];
            if (localData.length) {
                hydrateBreakfastData(localData);
                return;
            }

            try {
                const data = await fetchWithTimeout(mocktailsUrl);
                if (Array.isArray(data) && data.length) hydrateBreakfastData(data);
            } catch (e) {
                if (!localData.length) {
                    document.getElementById('loader-text').innerHTML = `<span class='text-red-400'>${t('error_connection')}</span>`;
                }
            }
        }

        // === RENDER ===
        function renderFilters() {
            const container = document.getElementById('filters-container');
            const list = activeList();
            container.innerHTML = activeFilters().map(f => {
                const count = f.match
                    ? list.filter(c => c && c.name && matchesBase(c, f)).length
                    : list.filter(c => c && c.name).length;
                if (count === 0 && f.match) return '';
                const isActive = currentFilter === f.key;
                return `<button onclick="filterBy('${f.key}')" class="${isActive ? 'filter-active' : ''} shrink-0 font-roman text-xs uppercase text-cream-dim hover:text-gold transition whitespace-nowrap active:scale-95">
                    <span>${escapeHtml(t(f.key))} · ${count}</span>
                </button>`;
            }).join('');
        }

        function updateFavBar() {
            document.getElementById('fav-count').textContent = `· ${toRoman(favorites.length) || '–'}`;
            const btn = document.getElementById('fav-toggle');
            const icon = document.getElementById('fav-icon');
            const label = document.getElementById('fav-label');
            if (showFavoritesOnly) {
                btn.classList.add('!text-gold-bright');
                icon.textContent = '◆';
                label.textContent = t('fav_all');
            } else {
                btn.classList.remove('!text-gold-bright');
                icon.textContent = '◇';
                label.textContent = t('fav_selected');
            }
        }

        function renderCard(d, i) {
            const isFav = favorites.includes(d.name);
            const cardId = `card-${d._idx}`;
            const delay = Math.min(i * 0.06, 0.4);

            return `
                    <article class="cocktail-card deco-card overflow-hidden" id="${cardId}" style="animation-delay: ${delay}s">
                        <div class="relative">
                            <img src="${getRecipeImg(d)}" class="w-full h-48 object-cover" loading="lazy" onerror="this.onerror=null;this.src='${getRecipeFallbackImg(d)}'">
                            <button data-cocktail="${escapeHtml(d.name)}" onclick="toggleFavorite(this, event)"
                                    aria-label="Toggle favorite"
                                    class="fav-btn absolute top-3 right-3 w-10 h-10 bg-ink/80 backdrop-blur-sm border ${isFav ? 'border-gold-bright text-gold-bright' : 'border-gold-dim text-cream-dim'} flex items-center justify-center text-base active:scale-90 transition">
                                ${isFav ? '◆' : '◇'}
                            </button>
                        </div>

                        <div class="p-5">
                            <div class="flex items-center justify-between gap-3 mb-2">
                                <span class="font-roman text-xs tracking-[0.26em] uppercase text-gold-dim">${escapeHtml(loc(d,'base') || 'Закуска')}</span>
                                <span class="text-xl" aria-hidden="true">◇</span>
                            </div>
                            <h2 class="font-body text-3xl leading-tight text-cream font-semibold">${escapeHtml(loc(d,'name'))}</h2>
                            <p class="mt-2 text-cream-dim italic">${d.ingredients ? `${String(loc(d,'ingredients')).split(',').filter(Boolean).length} съставки` : 'Рецепта'} · Brunch 365</p>
                        </div>

                        <!-- Ingredients -->
                        ${d.ingredients ? `
                        <div class="px-5 pb-5">
                            <div class="deco-divider mb-4"><span class="font-roman text-xs tracking-[0.28em] uppercase text-gold">съставки</span></div>
                            <ul class="space-y-1.5">
                                ${String(loc(d,'ingredients')).split(',').map(ing => ing.trim()).filter(Boolean).map(ing => `
                                <li class="flex items-baseline gap-3">
                                    <span class="text-gold text-[0.5rem] shrink-0 mt-1">◆</span>
                                    <span class="font-roman text-cream-dim text-sm">${escapeHtml(convertUnits(ing))}</span>
                                </li>`).join('')}
                            </ul>
                        </div>` : ''}

                        <!-- Recipe -->
                        <div class="px-5 pb-6 pt-2 border-t border-gold-dim/30">
                            <div class="deco-divider mb-4"><span class="font-roman text-xs tracking-[0.28em] uppercase text-gold">стъпки</span></div>
                            <div class="recipe-content text-cream/80 text-base">
                                ${convertUnits(loc(d,'recipe') || '')}
                            </div>
                        </div>
                    </article>
                `;
        }

        function render(resetPage = true) {
            const data = getFiltered();
            const container = document.getElementById('cocktail-list');
            const countEl = document.getElementById('result-count');

            const word = data.length === 1 ? t('count_word_one') : t('count_word_many');
            countEl.textContent = `${toRoman(data.length) || '–'} · ${word}`;
            updateFavBar();

            if (resetPage) currentPage = 1;

            if (data.length === 0) {
                let msg;
                if (showFavoritesOnly && favorites.length === 0) {
                    msg = `${t('empty_fav')}<br><span class="font-roman text-xs tracking-widest text-cream-dim/70 mt-3 inline-block">${t('empty_fav_hint')}</span>`;
                } else if (searchQuery) {
                    msg = t('empty_search', { q: `<span class="text-gold italic">${escapeHtml(searchQuery)}</span>` });
                } else {
                    msg = t('empty_selection');
                }
                container.innerHTML = `
                    <div class="text-center py-20">
                        <div class="text-gold text-4xl mb-6 opacity-30">✦ ◆ ✦</div>
                        <p class="font-body italic text-cream-dim">${msg}</p>
                    </div>`;
                return;
            }

            const page   = data.slice(0, currentPage * PAGE_SIZE);
            const hasMore = data.length > page.length;

            container.innerHTML = page.map((d, i) => renderCard(d, i)).join('') +
                (hasMore ? `
                <div class="text-center py-8">
                    <button onclick="loadMore()" class="border border-gold-dim text-cream-dim hover:text-gold hover:border-gold font-roman text-xs tracking-[0.3em] uppercase py-3 px-8 transition">
                        ${t('load_more')} · ${toRoman(data.length - page.length)}
                    </button>
                </div>` : '');
        }

        function loadMore() {
            currentPage++;
            render(false);
            // Keep scroll position
        }

        // === SEARCH ===
        function onSearch(q) {
            searchQuery = q;
            document.getElementById('search-clear').classList.toggle('hidden', !q);
            document.getElementById('search-icon').classList.toggle('hidden', !!q);
            render();
        }
        function clearSearch() {
            document.getElementById('search-input').value = '';
            onSearch('');
        }

        // === FILTERS ===
        function filterBy(category) {
            currentFilter = category;
            renderFilters();
            render();
        }

        // === FAVORITES ===
        function toggleFavorite(btn, event) {
            event.stopPropagation();
            event.preventDefault();
            const name = btn.dataset.cocktail;
            if (!name) return;

            const wasFav = favorites.includes(name);
            if (wasFav) {
                favorites = favorites.filter(f => f !== name);
            } else {
                favorites.push(name);
                btn.classList.add('star-pop');
                setTimeout(() => btn.classList.remove('star-pop'), 450);
            }
            try { localStorage.setItem('brk365-favorites', JSON.stringify(favorites)); } catch (e) {}

            const isFav = !wasFav;
            btn.innerHTML = isFav ? '◆' : '◇';
            btn.className = `fav-btn absolute top-3 right-3 w-10 h-10 bg-ink/70 backdrop-blur-sm border ${isFav ? 'border-gold-bright text-gold-bright' : 'border-gold-dim text-cream-dim'} flex items-center justify-center text-base hover:border-gold hover:text-gold active:scale-90 transition`;

            updateFavBar();
            if (showFavoritesOnly && !isFav) render();
        }

        function toggleFavoritesView() {
            showFavoritesOnly = !showFavoritesOnly;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

        // === AI ACTION SHEET ===
        function openAISheet() {
            const actions = [
                { icon: '✦', title: t('ai_random_title'), desc: t('ai_random_desc'), action: 'pickRandom()' },
                { icon: showFavoritesOnly ? '◇' : '◆', title: showFavoritesOnly ? t('ai_fav_show_all') : `${t('ai_fav_title')} · ${toRoman(favorites.length) || '–'}`, desc: showFavoritesOnly ? t('ai_fav_desc_off') : t('ai_fav_desc_on'), action: 'fromSheetFavorites()' },
                { icon: '❦', title: t('ai_stats_title'), desc: t('ai_stats_desc'), action: 'showStats()' },
            ];

            document.getElementById('ai-actions').innerHTML = actions.map(a => `
                <button onclick="${a.action}" class="w-full border border-gold-dim hover:border-gold hover:bg-ink-soft active:scale-[0.99] transition p-4 flex items-center gap-4 text-left group">
                    <span class="text-2xl text-gold w-8 text-center">${a.icon}</span>
                    <div class="flex-1 min-w-0">
                        <div class="font-roman text-cream tracking-[0.15em] uppercase text-sm group-hover:text-gold-bright transition">${escapeHtml(a.title)}</div>
                        <div class="font-body italic text-xs text-cream-dim truncate">${escapeHtml(a.desc)}</div>
                    </div>
                    <span class="text-gold-dim group-hover:text-gold transition">›</span>
                </button>
            `).join('');

            document.getElementById('ai-sheet').classList.remove('hidden');
        }

        function closeAISheet() { document.getElementById('ai-sheet').classList.add('hidden'); }

        function pickRandom() {
            closeAISheet();
            const pool = getFiltered();
            if (pool.length === 0) { alert(t('alert_empty')); return; }
            const pick = pool[Math.floor(Math.random() * pool.length)];
            highlightCocktail(pick);
        }

        function cocktailOfTheDay() {
            closeAISheet();
            const pool = allCocktails.filter(c => c && c.name);
            if (pool.length === 0) return;
            const today = new Date();
            const seed = today.getFullYear() * 1000 + today.getMonth() * 50 + today.getDate();
            const pick = pool[seed % pool.length];

            currentFilter = 'filter_all';
            searchQuery = '';
            showFavoritesOnly = false;
            document.getElementById('search-input').value = '';
            document.getElementById('search-clear').classList.add('hidden');
            document.getElementById('search-icon').classList.remove('hidden');
            renderFilters();
            render();

            setTimeout(() => highlightCocktail(pick), 200);
        }

        function fromSheetFavorites() {
            closeAISheet();
            toggleFavoritesView();
        }

        function highlightCocktail(cocktail) {
            const el = document.getElementById(`card-${cocktail._idx}`);
            if (el) {
                el.scrollIntoView({ behavior: 'instant', block: 'center' });
                setTimeout(() => {
                    el.classList.add('highlight');
                    setTimeout(() => el.classList.remove('highlight'), 3500);
                }, 450);
            }
        }

        // === STATS ===
        function showStats() {
            closeAISheet();
            const valid = allCocktails.filter(c => c && c.name);
            const total = valid.length;

            const baseStats = {};
            const baseLabel = {};
            valid.forEach(c => {
                const b = (c.base || 'Други').trim();
                baseStats[b] = (baseStats[b] || 0) + 1;
                if (!baseLabel[b]) baseLabel[b] = loc(c, 'base') || b;
            });
            const sortedBases = Object.entries(baseStats).sort((a, b) => b[1] - a[1]);
            const topBase = sortedBases[0] || ['—', 0];

            const hour = new Date().getHours();
            let timeRec;
            if (hour < 12) timeRec = t('stats_time_morning');
            else if (hour < 17) timeRec = t('stats_time_afternoon');
            else if (hour < 22) timeRec = t('stats_time_evening');
            else timeRec = t('stats_time_late');

            const html = `
                <!-- Two big numbers -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="border border-gold-dim p-5 text-center">
                        <div class="font-display text-5xl text-gold-bright leading-none mb-2">${toRoman(total)}</div>
                        <div class="font-roman text-cream-dim text-[0.65rem] tracking-[0.4em] uppercase">${t('stats_cocktails')}</div>
                    </div>
                    <div class="border border-gold-dim p-5 text-center">
                        <div class="font-display text-5xl text-gold-bright leading-none mb-2">${toRoman(favorites.length) || '–'}</div>
                        <div class="font-roman text-cream-dim text-[0.65rem] tracking-[0.4em] uppercase">${t('stats_favorites')}</div>
                    </div>
                </div>

                <!-- Distribution -->
                <div class="border border-gold-dim p-5">
                    <div class="deco-divider mb-5">
                        <span class="font-roman text-gold text-[0.65rem] tracking-[0.4em] uppercase whitespace-nowrap">${t('stats_distribution')}</span>
                    </div>
                    ${sortedBases.slice(0, 8).map(([base, count]) => {
                        const pct = total ? Math.round(count / total * 100) : 0;
                        return `
                            <div class="mb-4 last:mb-0">
                                <div class="flex justify-between items-baseline mb-1.5">
                                    <span class="font-roman text-cream text-sm tracking-[0.1em] uppercase">${escapeHtml(baseLabel[base] || base)}</span>
                                    <span class="font-body italic text-cream-dim text-xs">${toRoman(count)} · ${pct}%</span>
                                </div>
                                <div class="h-px bg-gold-dim/40 relative overflow-hidden">
                                    <div class="absolute inset-y-0 left-0 bg-gradient-to-r from-gold-dim via-gold to-gold-bright" style="width: ${pct}%; height: 2px; top: -0.5px;"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>

                <!-- Recommendation block -->
                <div class="border border-gold relative p-6">
                    <span class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-ink px-3 font-roman text-gold text-[0.6rem] tracking-[0.5em] uppercase">${t('stats_rec_badge')}</span>
                    <p class="font-body italic text-cream text-base leading-relaxed text-center">
                        ${t('stats_rec_line1', { hour: `<span class="text-gold-bright">${hour}</span>`, rec: `<span class="text-gold-bright">${timeRec}</span>` })}
                    </p>
                    <p class="font-body italic text-cream-dim text-sm leading-relaxed text-center mt-3">
                        ${t('stats_rec_line2', { base: `<span class="text-gold not-italic font-roman tracking-[0.1em] uppercase">${escapeHtml(baseLabel[topBase[0]] || topBase[0])}</span>`, count: `<span class="text-gold-bright">${toRoman(topBase[1])}</span>` })}
                    </p>
                </div>
            `;

            document.getElementById('stats-content').innerHTML = html;
            document.getElementById('stats-modal').classList.remove('hidden');
        }

        function closeStats() { document.getElementById('stats-modal').classList.add('hidden'); }

        // === SHARE ===
        async function shareApp() {
            const url  = window.location.href;
            const data = { title: 'Brunch 365', text: t('share_text'), url };
            if (navigator.share) {
                try { await navigator.share(data); return; } catch (e) {}
            }
            try {
                await navigator.clipboard.writeText(url);
                showToast(t('toast_link_copied'));
            } catch (e) {
                showToast(url);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        }

        // === BACK TO TOP ===
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('back-to-top');
            if (window.scrollY > 400) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        }, { passive: true });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeAISheet(); closeStats(); closeSettings(); }
        });

        // Init only if age already verified (new users go through age gate first)
        try {
            underAge=false; currentMode='mocktails'; init();
        } catch(e) { init(); }
    </script>

    <!-- SERVICE WORKER REGISTRATION -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swPath = location.hostname === 'brunch.freefrom365.com' ? '/sw.js' : '/breakfast/sw.js';
                navigator.serviceWorker.register(swPath)
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7efe1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gluten Free 365">
  <link rel="manifest" href="manifest.json">
  <title>Gluten Free 365 · Без глутен</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Forum&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fffaf0;
      --paper-soft: #f4ead8;
      --ink: #30271d;
      --muted: #7d6b58;
      --line: #d8c5aa;
      --sage: #66845d;
      --berry: #9d4f55;
      --honey: #c2852d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cormorant Garamond", serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,250,240,.92), rgba(244,234,216,.94)),
        url("https://images.unsplash.com/photo-1490818387583-1baba5e638af?w=1400&auto=format&fit=crop&q=80") center/cover fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle at 20% 0%, rgba(194,133,45,.14), transparent 36%), radial-gradient(circle at 100% 18%, rgba(102,132,93,.12), transparent 34%);
    }
    button, input { font: inherit; }
    .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 26px 18px 118px; }
    .rule { display: flex; align-items: center; gap: 12px; color: var(--sage); }
    .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
    .panel {
      background: rgba(255,250,240,.88);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(81, 57, 31, .12);
    }
    .deco-card {
      background: rgba(255,250,240,.9);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(81, 57, 31, .12);
    }
    .deco-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--honey);
    }
    .deco-divider::before,
    .deco-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
    }
    .recipe-content {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      line-height: 1.72;
    }
    .recipe-card { animation: rise .45s cubic-bezier(.16,1,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .chip-active {
      background: var(--sage) !important;
      color: white !important;
      border-color: var(--sage) !important;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .safe-bottom { padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    .modal-bg { background: rgba(48,39,29,.62); backdrop-filter: blur(10px); }
    .star-pop { animation: starPop .42s cubic-bezier(.16,1,.3,1); }
    @keyframes starPop {
      0% { transform: scale(.72); }
      55% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 28%, rgba(102,132,93,.16), transparent 34%),
        linear-gradient(180deg, #fffaf0 0%, #f4ead8 100%);
      transition: opacity .8s cubic-bezier(.25,1,.5,1), visibility .8s;
    }
    #app-loader.loaded { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
    }
    .splash-logo-wrap {
      position: relative;
      width: 146px;
      height: 146px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      animation: splashReveal 1.2s cubic-bezier(.16,1,.3,1) both;
    }
    .splash-logo-wrap::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 999px;
      background: conic-gradient(from 210deg, transparent 0 22%, rgba(102,132,93,.46) 33%, rgba(194,133,45,.55) 52%, transparent 66% 100%);
      -webkit-mask: radial-gradient(circle, transparent 58%, #000 59% 64%, transparent 65%);
      mask: radial-gradient(circle, transparent 58%, #000 59% 64%, transparent 65%);
      opacity: .7;
      animation: haloTurn 5.2s linear infinite;
    }
    .splash-logo {
      position: relative;
      z-index: 1;
      width: 108px;
      height: 108px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 20px 34px rgba(48,39,29,.16));
      animation: logoBreathe 3.4s ease-in-out .9s infinite;
    }
    .splash-title {
      margin: 15px 0 8px;
      color: var(--ink);
      font-family: "Forum", serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 8px;
      text-transform: uppercase;
      opacity: 0;
      animation: splashFade 1.8s ease 1s forwards;
    }
    .splash-subtitle {
      margin: 0 0 25px;
      color: var(--sage);
      font-family: "Forum", serif;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: 0;
      animation: splashFade 1.8s ease 1.5s forwards;
    }
    .splash-status {
      color: var(--berry);
      font-family: "Forum", serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      animation: splashFade 1.5s ease 2s forwards;
    }
    .splash-progress {
      position: relative;
      width: 158px;
      height: 1px;
      margin-top: 18px;
      overflow: hidden;
      background: linear-gradient(90deg, transparent, rgba(216,197,170,.8), transparent);
      opacity: 0;
      animation: splashFade 1.2s ease 2.2s forwards;
    }
    .splash-progress::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, rgba(194,133,45,.86), rgba(102,132,93,.78), transparent);
      animation: progressGlide 1.9s cubic-bezier(.65,0,.35,1) infinite;
    }
    .img-fallback {
      background:
        radial-gradient(circle at 50% 38%, rgba(102,132,93,.18), transparent 34%),
        linear-gradient(135deg, rgba(255,250,240,.98), rgba(244,234,216,.95));
      object-fit: contain !important;
      padding: 42px;
    }
    @keyframes splashReveal {
      from { opacity: 0; transform: translateY(10px) scale(.92); }
      to { opacity: 1; transform: none; }
    }
    @keyframes splashFade { to { opacity: 1; } }
    @keyframes haloTurn { to { transform: rotate(360deg); } }
    @keyframes logoBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.025); }
    }
    @keyframes progressGlide {
      from { transform: translateX(-110%); }
      to { transform: translateX(245%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-logo-wrap,
      .splash-logo-wrap::before,
      .splash-logo,
      .splash-title,
      .splash-subtitle,
      .splash-status,
      .splash-progress,
      .splash-progress::after,
      .recipe-card {
        animation: none !important;
      }
      .splash-title,
      .splash-subtitle,
      .splash-status,
      .splash-progress {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" aria-label="Gluten Free 365">
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <img class="splash-logo" src="logo-source.png" alt="">
      </div>
      <h1 class="splash-title">Gluten Free 365</h1>
      <p class="splash-subtitle">Gluten Free</p>
      <div class="splash-status">Подготвяне на рецептите</div>
      <div class="splash-progress" aria-hidden="true"></div>
    </div>
  </div>

  <main class="app">
    <header class="pb-6 text-center">

        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="w-10 h-10 border border-[var(--line)] grid place-items-center text-[var(--sage)] active:scale-95" aria-label="Нагоре"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>

        </button>
      </div>
      <p class="font-[Forum] text-xs tracking-[.34em] uppercase text-[var(--sage)]">Gluten Free</p>
      <h1 class="text-[3rem] leading-none tracking-[.08em] font-semibold mt-1">Gluten Free 365</h1>
      <div class="rule max-w-[280px] mx-auto mt-3"><span class="font-[Forum] text-xs tracking-[.28em] uppercase">чиста кухня</span></div>
    </header>

    <section class="panel p-4 mb-5">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--sage)]" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
        <input id="search" class="w-full bg-white/60 border border-[var(--line)] py-3.5 pl-10 pr-12 outline-none focus:border-[var(--sage)]" placeholder="Търси по име, съставка или режим">
        <button id="searchClear" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 border border-[var(--line)] text-[var(--muted)] active:scale-95" aria-label="Изчисти търсенето">×</button>
      </div>
    </section>

    <nav id="filters" class="flex gap-3 overflow-x-auto no-scrollbar pb-3 mb-3"></nav>

    <div class="flex items-center justify-between mb-4">
      <span id="count" class="font-[Forum] text-xs tracking-[.26em] uppercase text-[var(--muted)]"></span>
      <button id="favoritesToggle" class="font-[Forum] text-xs tracking-[.22em] uppercase text-[var(--sage)]">◇ Любими · 0</button>
    </div>

    <section id="list" class="space-y-8"></section>
    <footer class="mt-14 text-center">
      <div class="deco-divider mb-5 max-w-[200px] mx-auto"><span class="text-[var(--honey)] text-xs">❦</span></div>
      <p class="font-[Forum] text-[var(--honey)] text-[.65rem] tracking-[.35em] uppercase mb-2">Контакт</p>
      <a href="mailto:office@newage-studio.com" class="italic text-lg text-[var(--ink)] hover:text-[var(--honey)] transition">office@newage-studio.com</a>
      <p class="mt-5 font-[Forum] text-[var(--muted)] text-[.58rem] tracking-[.22em] uppercase">© 2026 New Age Studio. Всички права запазени.</p>
      <p class="mt-3 mx-auto max-w-sm italic text-[var(--muted)] text-sm leading-relaxed">Рецепти за вдъхновение. Съобразявайте съставките с личните си нужди и алергии.</p>
    </footer>
  </main>

  <button id="backToTop" class="hidden fixed bottom-5 right-5 z-40 w-10 h-10 border border-[var(--line)] bg-[var(--paper)]/90 backdrop-blur text-[var(--sage)] active:scale-95" aria-label="Нагоре">
    ↑
  </button>

  <div id="modal" class="hidden fixed inset-0 z-50">
    <button id="closeLayer" class="modal-bg absolute inset-0 w-full h-full" aria-label="Затвори"></button>
    <article class="absolute bottom-0 left-0 right-0 max-w-[520px] mx-auto max-h-[90vh] overflow-y-auto bg-[var(--paper)] border-t border-[var(--line)] safe-bottom">
      <button onclick="closeModal()" class="sticky top-4 left-4 z-10 ml-4 mt-4 inline-flex items-center gap-2 bg-[var(--paper)]/90 backdrop-blur border border-[var(--line)] px-3 py-2 font-[Forum] text-xs tracking-[.22em] uppercase text-[var(--sage)] active:scale-95" aria-label="Назад към рецептите">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Назад
      </button>
      <img id="modalImg" class="w-full h-64 object-cover" alt="">
      <div class="p-6">
        <div class="flex items-center justify-between gap-4 mb-3">

        </div>
        <h2 id="modalTitle" class="text-4xl leading-tight font-semibold mb-3"></h2>
        <p id="modalMeta" class="text-[var(--muted)] italic mb-5"></p>
        <div class="rule mb-5"><span class="font-[Forum] text-xs tracking-[.28em] uppercase">съставки</span></div>
        <ul id="modalIngredients" class="space-y-2 mb-6"></ul>

        <ol id="modalSteps" class="space-y-4"></ol>
      </div>
    </article>
  </div>

    function saveFavs() { try { localStorage.setItem("glutenfree-favorites", JSON.stringify(favorites)); } catch(e) {} }
    function toggleFav(id) {
      favorites = isFav(id) ? favorites.filter(x => x !== id) : favorites.concat(id);
      saveFavs();
      render(false);
      const btn = document.querySelector(`[data-fav-id="${id}"]`);
      if (btn && isFav(id)) {
        btn.classList.add("star-pop");
        setTimeout(() => btn.classList.remove("star-pop"), 450);
      }
    }
    function shuffled(list) {
      return list.slice().sort((a,b) => ((a.id * 9301 + orderSeed * 49297) % 233280) - ((b.id * 9301 + orderSeed * 49297) % 233280));
    }
    function filtered() {
      const q = $("search").value.trim().toLowerCase();
      let data = recipes.filter(r => currentCat === "Всички" || r.cat === currentCat);
      if (showFavs) data = data.filter(r => isFav(r.id));
      if (q) data = data.filter(r => [r.name, r.cat, r.tag, r.ingredients.join(" ")].join(" ").toLowerCase().includes(q));
      return shuffled(data);
    }
    function renderFilters() {
      $("filters").innerHTML = categories.map(cat => `
        <button class="${cat === currentCat ? "chip-active" : ""} shrink-0 border border-[var(--line)] px-4 py-2 font-[Forum] text-xs tracking-[.22em] uppercase text-[var(--muted)]"
          onclick="currentCat='${cat}'; currentPage=1; renderFilters(); render();">${cat}</button>
      `).join("");
    }
    function render(resetPage = false) {
      if (resetPage) currentPage = 1;
      const data = filtered();
      $("count").textContent = `${toRoman(data.length) || "–"} · рецепти`;
      $("favoritesToggle").textContent = showFavs ? `◆ Всички · ${toRoman(favorites.length) || "–"}` : `◇ Любими · ${toRoman(favorites.length) || "–"}`;
      const page = data.slice(0, currentPage * PAGE_SIZE);
      const hasMore = data.length > page.length;
      $("list").innerHTML = page.map((r, i) => `
        <article class="recipe-card deco-card overflow-hidden" style="animation-delay:${Math.min(i * .04, .28)}s">
          <div>
            <div class="relative">
            <img class="w-full h-48 object-cover" src="${imageSrc(r.img)}" alt="${escapeHtml(r.name)}" loading="lazy" onerror="imgFallback(this)">
              <button data-fav-id="${r.id}" onclick="event.stopPropagation(); toggleFav(${r.id})" aria-label="Любима рецепта" class="absolute top-3 right-3 w-10 h-10 bg-[var(--paper)]/80 backdrop-blur border border-[var(--line)] text-[var(--berry)] grid place-items-center text-xl active:scale-90">${isFav(r.id) ? "◆" : "◇"}</button>
            </div>
            <div class="p-5">
              <div class="flex items-center justify-between gap-3 mb-2">
                <span class="font-[Forum] text-xs tracking-[.26em] uppercase text-[var(--sage)]">${escapeHtml(r.cat)} · ${escapeHtml(r.time)}</span>
                <span class="text-xl text-[var(--line)]" aria-hidden="true">◇</span>
              </div>
              <h2 class="text-3xl leading-tight font-semibold">${escapeHtml(r.name)}</h2>
              <p class="mt-2 text-[var(--muted)] italic">${escapeHtml(r.tag)} · без глутен</p>
            </div>
            <div class="px-5 pb-5">
              <div class="deco-divider mb-4"><span class="font-[Forum] text-xs tracking-[.28em] uppercase text-[var(--honey)]">съставки</span></div>
              <ul class="space-y-1.5">
                ${r.ingredients.map(x => `<li class="flex items-baseline gap-3"><span class="text-[var(--honey)] text-[.5rem] shrink-0 mt-1">◆</span><span class="font-[Forum] text-sm text-[var(--muted)]">${escapeHtml(x)}</span></li>`).join("")}
              </ul>
            </div>
            <div class="px-5 pb-6 pt-2 border-t border-[var(--line)]/70">
              <div class="deco-divider mb-4"><span class="font-[Forum] text-xs tracking-[.28em] uppercase text-[var(--honey)]">стъпки</span></div>
              <ol class="recipe-content space-y-3 text-[var(--ink)]/82">
                ${r.steps.map((x, idx) => `<li class="flex gap-3"><span class="w-7 h-7 border border-[var(--line)] grid place-items-center shrink-0 font-[Forum] not-italic text-[var(--sage)]">${idx + 1}</span><span>${escapeHtml(x)}</span></li>`).join("")}
              </ol>
            </div>
          </div>
        </article>
      `).join("") + (hasMore ? `
        <div class="text-center py-5">
          <button onclick="loadMore()" class="border border-[var(--line)] text-[var(--muted)] hover:text-[var(--sage)] hover:border-[var(--sage)] font-[Forum] text-xs tracking-[.28em] uppercase py-3 px-7 active:scale-95 transition">
            Покажи още · ${toRoman(data.length - page.length)}
          </button>
        </div>
      ` : "") || `<div class="text-center py-16 text-[var(--muted)] italic">Няма рецепти в тази селекция.</div>`;
    }
    function loadMore() {
      currentPage++;
      render(false);
    }
    function fillModal(r) {
      $("modalImg").classList.remove("img-fallback");
      $("modalImg").onerror = function() { imgFallback(this); };
      $("modalImg").src = imageSrc(r.img);
      $("modalTitle").textContent = r.name;
      $("modalTag").textContent = `${r.cat} · ${r.time}`;
      $("modalMeta").textContent = `${r.tag} · без глутен`;
      $("modalFav").textContent = isFav(r.id) ? "◆" : "◇";
      $("modalFav").onclick = () => toggleFav(r.id);
      $("modalIngredients").innerHTML = r.ingredients.map(x => `<li class="flex gap-3"><span class="text-[var(--sage)]">◆</span><span>${escapeHtml(x)}</span></li>`).join("");
      $("modalSteps").innerHTML = r.steps.map((x, i) => `<li class="flex gap-3"><span class="w-7 h-7 border border-[var(--line)] grid place-items-center shrink-0 font-[Forum] text-[var(--sage)]">${i+1}</span><span>${escapeHtml(x)}</span></li>`).join("");
    }
    function openRecipe(id) {
      const r = recipes.find(x => x.id === id);
      if (!r) return;
      fillModal(r);
      $("modal").classList.remove("hidden");
    }
    function closeModal() { $("modal").classList.add("hidden"); }

    $("search").addEventListener("input", () => {
      $("searchClear").classList.toggle("hidden", !$("search").value);
      render(true);
    });
    $("searchClear").addEventListener("click", () => {
      $("search").value = "";
      $("searchClear").classList.add("hidden");
      render(true);
      $("search").focus();
    });
    $("favoritesToggle").addEventListener("click", () => { showFavs = !showFavs; render(true); window.scrollTo({top:0, behavior:"smooth"}); });
    $("shuffleBtn").addEventListener("click", () => { orderSeed++; render(true); window.scrollTo({top:0, behavior:"smooth"}); });
    $("closeLayer").addEventListener("click", closeModal);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
    $("backToTop").addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));
    window.addEventListener("scroll", () => $("backToTop").classList.toggle("hidden", window.scrollY < 520), { passive: true });
    renderFilters();
    render();
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  </script>
</body>
</html>
